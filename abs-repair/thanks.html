<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Received — ABS Module Repair</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c0f;--surface:#111418;--border:#2a3446;--accent:#e8a020;--green:#1aff8c;--text:#d0d8e8;--text-mid:#9aa6ba;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;line-height:1.6;}
.box{max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:36px;text-align:center;}
.check{font-size:2.4rem;color:var(--green);margin-bottom:10px;}
h1{font-family:'Orbitron',sans-serif;color:#fff;font-size:1.4rem;margin-bottom:12px;letter-spacing:.04em;}
p{color:var(--text-mid);margin-bottom:24px;}
a{display:inline-block;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;padding:14px 22px;border-radius:6px;background:var(--accent);color:#000;text-decoration:none;}
</style>
</head>
<body>
  <div class="box">
    <div class="check">✓</div>
    <h1>Request received</h1>
    <p>Thanks — we'll review your vehicle details and reply within one business day with a price and shipping instructions.</p>
    <a href="/abs-repair/">Back to site</a>
  </div>
</body>
</html>
